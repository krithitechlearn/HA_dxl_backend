spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ha_dxl_dev
    username: ha_dxl_user
    password: ${DB_PASSWORD:devpassword}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.ha.dxl: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
